<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>小苏教程站</title>
<style>
body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;color:#222}
.wrap{max-width:460px;margin:0 auto;padding:12px}
.banner{display:flex;overflow:auto;gap:8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.banner-item{min-width:100%;height:130px;border-radius:12px;overflow:hidden;position:relative;scroll-snap-align:start;background:linear-gradient(120deg,#ff6e4a,#ffb53d);color:#fff;text-decoration:none;display:block}
.banner-item img{width:100%;height:100%;object-fit:cover}.banner-title{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.25);padding:4px 8px;border-radius:8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:#fff;border-radius:12px;padding:12px;margin-top:12px}
.entry{text-align:center;text-decoration:none;color:#333;font-size:12px}.entry img{width:46px;height:46px;border-radius:23px;object-fit:cover;background:#f2f2f2}
.tabs{display:flex;gap:18px;overflow:auto;padding:12px 2px 8px}.tab{white-space:nowrap;color:#555;text-decoration:none;font-weight:600}.tab.active{color:#ff6f3c}
.coupon{background:linear-gradient(90deg,#ff2323,#ff4b2d);border-radius:12px;padding:6px;margin:10px 0}
.coupon-in{background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:10px}
.left{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#f2f2f2}
.title{font-size:20px;font-weight:800}.summary{font-size:13px;color:#666;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:210px;line-height:1.4}
.btn{width:56px;height:56px;border-radius:28px;background:#ffd2b4;color:#c0392b;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto;text-decoration:none}
.doc-btn{display:inline-block;margin-top:6px;font-size:12px;color:#2c55d8;text-decoration:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50}#modal .box{background:#fff;max-width:460px;margin:8vh auto 0;border-radius:12px;padding:12px;max-height:80vh;overflow:auto}
#docWrap img,#docWrap video{max-width:100%;border-radius:8px;margin:8px 0}
</style></head><body>
<div class="wrap">
  <div id="banner" class="banner"></div>
  <div id="entries" class="grid"></div>
  <div id="tabs" class="tabs"></div>
  <div id="cards"></div>
</div>
<div id="modal" onclick="if(event.target.id==='modal')closeDoc()"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h3 id="docTitle">详情</h3><button onclick="closeDoc()">关闭</button></div><div id="docWrap"></div></div></div>
<script>
let active='all', cardMap={};
function openDoc(id){const c=cardMap[id]; if(!c) return; docTitle.innerText=c.title||'详情'; docWrap.innerHTML=c.contentHtml||'<p>暂无正文</p>'; modal.style.display='block';}
function closeDoc(){modal.style.display='none';}
async function load(){
  const [ads, shortcuts, tabsData, cardsData] = await Promise.all([
    fetch('http://localhost:5005/api/ads').then(r=>r.json()),
    fetch('http://localhost:5005/api/shortcuts').then(r=>r.json()),
    fetch('http://localhost:5005/api/tabs').then(r=>r.json()),
    fetch('http://localhost:5005/api/cards').then(r=>r.json())
  ]);
  cardMap = Object.fromEntries(cardsData.map(c=>[c.id,c]));
  banner.innerHTML = ads.map(a=>`<a class='banner-item' href='${a.link||'#'}' target='_blank'>${a.image?`<img src='${a.image}'/>`:''}<span class='banner-title'>${a.title||''}</span></a>`).join('');
  entries.innerHTML = shortcuts.map(s=>`<a class='entry' href='${s.link||'#'}' target='_blank'><img src='${s.icon||''}' onerror="this.style.display='none'"/><div>${s.name||''}</div></a>`).join('');
  tabs.innerHTML = tabsData.map(t=>`<a class='tab ${active===t.key?'active':''}' href='javascript:void(0)' onclick="active='${t.key}';load()">${t.name||''}</a>`).join('');
  const filtered = cardsData.filter(c=>c.enabled!==false).filter(c=>active==='all'||c.category===active);
  cards.innerHTML = filtered.map(c=>`<div class='coupon'><div class='coupon-in'>
      <div class='left'>${c.video?`<video class='logo' src='${c.video}' controls></video>`:`<img class='logo' src='${c.image||''}' onerror="this.style.display='none'"/>`}
        <div><div class='title'>${c.title||''}</div><div class='summary'>${(c.summary||'').replaceAll('\n','<br/>')}</div>${c.contentHtml?`<a class='doc-btn' href='javascript:void(0)' onclick="openDoc('${c.id}')">查看文档详情</a>`:''}</div>
      </div>
      <a class='btn' href='${c.link||'#'}' target='_blank'>${c.buttonText||'领'}</a>
    </div></div>`).join('');
}
load(); setInterval(load, 15000);
</script>
</body></html>
