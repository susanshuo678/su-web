<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小苏教程站</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;background:#f6f8fc;margin:0;color:#1f2a44}
    .wrap{max-width:920px;margin:0 auto;padding:14px}
    .ads{display:flex;gap:10px;overflow:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
    .ad{min-width:260px;background:linear-gradient(120deg,#ff7a7a,#ffb36b);color:#fff;border-radius:12px;padding:10px 12px;text-decoration:none;scroll-snap-align:start;flex:0 0 auto}
    h1{margin:8px 0 4px;font-size:28px}.muted{color:#6e7891}
    .card{background:#fff;border:1px solid #e6eaf2;border-radius:14px;padding:12px;margin:12px 0;display:grid;grid-template-columns:140px 1fr;gap:12px}
    img,video{width:140px;height:96px;object-fit:cover;border-radius:10px;background:#eef2fb}
    .summary{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
    a{color:#2c55d8;text-decoration:none}

    @media (max-width: 768px){
      .wrap{padding:12px}
      h1{font-size:24px}
      .ad{min-width:220px}
      .card{grid-template-columns:1fr;gap:10px;padding:10px}
      img,video{width:100%;height:auto;max-height:220px}
    }

    @media (max-width: 420px){
      .wrap{padding:10px}
      .ad{min-width:190px;font-size:14px}
      .card{border-radius:12px}
      h3{font-size:17px;margin:4px 0}
      .summary{font-size:14px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>小苏教程站</h1>
    <p class="muted">博客流 · 朋友口吻</p>
    <div id="ads" class="ads"></div>
    <div id="list"></div>
  </div>
<script>
async function load(){
  const [adsRes,cardsRes]=await Promise.all([
    fetch('http://localhost:5005/api/ads'),
    fetch('http://localhost:5005/api/cards')
  ]);
  const ads=await adsRes.json();
  const cards=await cardsRes.json();
  document.getElementById('ads').innerHTML=ads.map(a=>`<a class='ad' href='${a.link||'#'}' target='_blank'>${a.text||''}</a>`).join('');
  document.getElementById('list').innerHTML=cards.map(c=>`
    <article class='card'>
      <div>${c.video?`<video src='${c.video}' controls></video>`:`<img src='${c.image||''}' onerror="this.style.display='none'"/>`}</div>
      <div>
        <h3>${c.title||''}</h3>
        <p class='summary'>${c.summary||c.desc||''}</p>
        ${c.link?`<a href='${c.link}' target='_blank'>查看链接</a>`:''}
      </div>
    </article>`).join('');
}
load(); setInterval(load, 10000);
</script>
</body>
</html>
