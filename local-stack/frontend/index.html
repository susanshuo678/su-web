<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>小苏助手站</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#1b2437;--muted:#73809b;--pri:#3a7afe;--line:#e8edf7;--radius:14px;--shadow:0 8px 28px rgba(34,61,120,.08)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:14px 14px 92px}
.hero{background:linear-gradient(135deg,#3a7afe,#6ea1ff);color:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero h1{font-size:22px;margin:0 0 6px}.hero p{margin:0;opacity:.92;font-size:13px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--line)}
.badge{display:inline-block;background:#eef3ff;color:#2253c4;border-radius:999px;padding:2px 8px;font-size:12px;margin-bottom:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.shortcut{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--text)}
.icon{width:44px;height:44px;border-radius:12px;background:#f0f4ff;display:grid;place-items:center;overflow:hidden}.icon img{width:100%;height:100%;object-fit:cover}
.shortcut span{font-size:12px;color:#4b5876;text-align:center}
.ad{border-radius:12px;overflow:hidden;position:relative;background:#eef3ff;min-height:110px;aspect-ratio:3/1}.ad img{width:100%;height:100%;object-fit:cover;display:block}.ad .t{position:absolute;left:10px;bottom:8px;background:rgba(0,0,0,.5);color:#fff;padding:4px 8px;border-radius:999px;font-size:12px}
.tabpage{display:none}.tabpage.active{display:block}.list{display:grid;gap:10px}.item{content-visibility:auto;contain-intrinsic-size:320px}.item h3{margin:0 0 6px;font-size:16px}.sub{margin:0;color:var(--muted);font-size:13px;white-space:pre-line}
.media{margin-top:8px;border-radius:10px;overflow:hidden;background:#f2f5fb;aspect-ratio:16/9}.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
.btn{margin-top:10px;display:inline-block;padding:8px 12px;background:var(--pri);color:#fff;border-radius:10px;text-decoration:none;font-size:13px}
.card-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.btn-lite{display:inline-block;padding:8px 12px;background:#eef3ff;color:#2a4eab;border-radius:10px;text-decoration:none;font-size:13px;border:1px solid #d6e1ff;cursor:pointer}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:60}.bottom .inner{max-width:520px;width:100%;display:flex}
.nav-btn{flex:1;padding:11px 6px;background:none;border:0;color:#51607e;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav-btn span{font-size:15px}.nav-btn.active{color:var(--pri);font-weight:700}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.notice{background:#fff6e8;color:#9a6500;border:1px solid #f4d7a5;padding:8px 10px;border-radius:10px;font-size:12px;margin-bottom:10px}
.refresh{position:fixed;right:14px;bottom:94px;background:#1f4fd6;color:#fff;border:0;border-radius:999px;padding:10px 12px;font-size:12px;box-shadow:var(--shadow)}
.refresh.offline{background:#8a95ad}
.sync-time{position:fixed;right:14px;bottom:74px;color:#5d6b88;font-size:11px;background:rgba(255,255,255,.88);padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.sync-state{position:fixed;right:14px;bottom:52px;color:#4f607f;font-size:11px;background:rgba(255,255,255,.88);padding:3px 8px;border-radius:999px;border:1px solid var(--line);max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-state.error{color:#9e2f2f;border-color:#f0b5b5;background:#fff2f2}
.search-wrap{position:sticky;top:8px;z-index:30;background:rgba(246,248,252,.92);backdrop-filter:blur(4px);padding:6px 0 8px}
.search-row{display:flex;gap:8px;align-items:center}.search{flex:1;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);font-size:14px;background:#fff}.search-clear{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:#4f607f;font-size:12px;cursor:pointer}
.filter-row{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-chip{border:1px solid var(--line);background:#fff;color:#42506f;border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer}
.filter-chip.active{background:#2d63df;color:#fff;border-color:#2d63df}
.result-meta{margin-left:auto;color:#687998;font-size:12px}
.tabpage{display:none;opacity:0;transform:translateY(6px)}.tabpage.active{display:block;opacity:1;transform:none;transition:opacity .18s ease,transform .18s ease}
.to-top{position:fixed;right:14px;bottom:128px;border:0;background:#334f91;color:#fff;border-radius:999px;padding:9px 11px;font-size:12px;box-shadow:var(--shadow);display:none}
.to-top.show{display:block}
.skeleton{position:relative;overflow:hidden;background:#eef2fb;border-radius:10px;min-height:72px;margin-top:8px}
.skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shimmer 1.25s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.toast{position:fixed;left:50%;bottom:146px;transform:translateX(-50%);background:rgba(20,30,54,.9);color:#fff;padding:8px 12px;border-radius:999px;font-size:12px;z-index:90;display:none;max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hl{background:#fff2a8;color:#4b3d00;border-radius:4px;padding:0 2px}.new-badge{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:1px 6px;border-radius:999px;background:#ffe2e2;color:#c22f2f;font-size:11px;font-weight:700;vertical-align:middle}
body.dense-mode .card{padding:10px;border-radius:10px}body.dense-mode .item h3{font-size:15px;margin-bottom:4px}body.dense-mode .sub{font-size:12px;line-height:1.45}body.dense-mode .media{aspect-ratio:2.2/1}
</style>
</head>
<body>
<div class="app">
  <section class="hero"><h1>小苏助手</h1><p>轻量、快、可商用：内容由后台实时配置</p></section>
  <div id="staleNotice" class="notice" style="display:none" aria-live="polite">当前为离线缓存内容，网络恢复后会自动刷新。</div>
  <div class="search-wrap">
    <div class="search-row">
      <input id="cardSearch" class="search" placeholder="搜索内容（标题/摘要）" aria-label="搜索内容">
      <button id="randomPickBtn" class="search-clear" type="button" aria-label="随机看看">随机</button>
      <button id="copyTabDigestBtn" class="search-clear" type="button" aria-label="复制本栏摘要">复制本栏</button>
      <button id="clearSearchBtn" class="search-clear" type="button" aria-label="清空搜索">清空</button>
      <button id="resetFilterBtn" class="search-clear" type="button" aria-label="重置筛选">重置</button>
    </div>
    <div class="filter-row" role="group" aria-label="内容筛选">
      <button class="filter-chip active" data-media="all" type="button">全部</button>
      <button class="filter-chip" data-media="image" type="button">含图片</button>
      <button class="filter-chip" data-media="video" type="button">含视频</button>
      <button class="filter-chip" data-media="link" type="button">可领取</button>
      <button class="filter-chip" data-media="fresh-link" type="button">7天可领</button>
      <button class="filter-chip" data-media="fresh-14" type="button">14天更新</button>
      <button class="filter-chip" data-media="content" type="button">含正文</button>
      <button class="filter-chip" data-media="today" type="button">今日更新</button>
      <button id="starredFilterChip" class="filter-chip" data-media="starred" type="button">已收藏</button>
      <button class="filter-chip" data-media="unstarred" type="button">未收藏</button>
      <button id="starLinkFilterChip" class="filter-chip" type="button" aria-label="收藏且可领取">收藏+可领</button>
      <button id="clearStarBtn" class="filter-chip" type="button" aria-label="清空收藏">清空收藏</button>
      <button id="tabScopeToggle" class="filter-chip" type="button" aria-pressed="false">仅看当前栏目</button>
      <button id="recentSortToggle" class="filter-chip" type="button" aria-pressed="false">最近更新优先</button>
      <button id="focusModeToggle" class="filter-chip" type="button" aria-pressed="false">专注模式</button>
      <button id="denseModeToggle" class="filter-chip" type="button" aria-pressed="false">紧凑列表</button>
      <button id="hideVisitedToggle" class="filter-chip" type="button" aria-pressed="false">隐藏已浏览</button>
      <button id="claimUnseenToggle" class="filter-chip" type="button" aria-pressed="false">可领且未浏览</button>
      <button id="clearVisitedBtn" class="filter-chip" type="button">清空浏览记录</button>
      <button id="shareFilterBtn" class="filter-chip" type="button">复制筛选链接</button>
      <span id="resultMeta" class="result-meta" aria-live="polite">0 条内容</span>
    </div>
  </div>
  <section id="page-help" class="tabpage active"><section class="card"><p class="empty">内容加载中...</p><div class="skeleton"></div><div class="skeleton"></div></section></section>
  <section id="page-hang" class="tabpage"><section class="card"><p class="empty">内容加载中...</p><div class="skeleton"></div></section></section>
  <section id="page-bots" class="tabpage"><section class="card"><p class="empty">内容加载中...</p><div class="skeleton"></div></section></section>
</div>

<button id="refreshBtn" class="refresh" aria-label="刷新内容" title="刷新内容" onclick="manualRefresh()">刷新内容</button>
<button id="toTopBtn" class="to-top" aria-label="回到顶部" title="回到顶部">回顶部</button>
<div id="syncTime" class="sync-time" aria-live="polite">尚未同步</div>
<div id="syncState" class="sync-state" aria-live="polite">等待首次同步</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<nav class="bottom"><div class="inner">
  <button class="nav-btn active" aria-current="page" aria-label="助力" onclick="switchTab('help',this)">🧩<span id="tab-help">助力</span></button>
  <button class="nav-btn" aria-label="代挂" onclick="switchTab('hang',this)">📌<span id="tab-hang">代挂</span></button>
  <button class="nav-btn" aria-label="机器人列表" onclick="switchTab('bots',this)">🤖<span id="tab-bots">机器人列表</span></button>
</div></nav>

<script>
function saveTabScrollPosition(){
  const active = document.querySelector('.tabpage.active');
  if (!active) return;
  const key = active.id.replace('page-','');
  safeSetLocalStorage(`suweb_scroll_${key}`, String(window.scrollY || 0));
}
function restoreTabScrollPosition(name){
  const raw = safeGetLocalStorage(`suweb_scroll_${name}`);
  const y = Number(raw || 0);
  if (!Number.isFinite(y) || y < 0) return;
  requestAnimationFrame(() => window.scrollTo({ top: y, behavior: 'auto' }));
}
function switchTab(name, btn){saveTabScrollPosition();document.querySelectorAll('.tabpage').forEach(el=>el.classList.remove('active'));document.getElementById('page-'+name).classList.add('active');document.querySelectorAll('.nav-btn').forEach(el=>{el.classList.remove('active');el.removeAttribute('aria-current');});btn.classList.add('active');btn.setAttribute('aria-current','page');safeSetLocalStorage('suweb_active_tab', name);restoreTabScrollPosition(name);}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const jsq=s=>JSON.stringify(String(s??''));
function safeUrl(raw, fallback = '#'){
  const v = String(raw || '').trim();
  if (!v) return fallback;
  if (v.startsWith('/') || v.startsWith('./') || v.startsWith('../') || v.startsWith('#')) return v;
  try {
    const u = new URL(v, location.origin);
    if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
  } catch {}
  return fallback;
}
const pageHelpEl = document.getElementById('page-help');
const pageHangEl = document.getElementById('page-hang');
const pageBotsEl = document.getElementById('page-bots');
const tabHelpEl = document.getElementById('tab-help');
const tabHangEl = document.getElementById('tab-hang');
const tabBotsEl = document.getElementById('tab-bots');
const staleNoticeEl = document.getElementById('staleNotice');
const refreshBtnEl = document.getElementById('refreshBtn');
const toTopBtnEl = document.getElementById('toTopBtn');
const searchInputEl = document.getElementById('cardSearch');
const resultMetaEl = document.getElementById('resultMeta');
const mediaFilterEls = [...document.querySelectorAll('.filter-chip[data-media]')];
const tabScopeToggleEl = document.getElementById('tabScopeToggle');
const recentSortToggleEl = document.getElementById('recentSortToggle');
const clearSearchBtnEl = document.getElementById('clearSearchBtn');
const resetFilterBtnEl = document.getElementById('resetFilterBtn');
const randomPickBtnEl = document.getElementById('randomPickBtn');
const copyTabDigestBtnEl = document.getElementById('copyTabDigestBtn');
const clearStarBtnEl = document.getElementById('clearStarBtn');
const starLinkFilterChipEl = document.getElementById('starLinkFilterChip');
const focusModeToggleEl = document.getElementById('focusModeToggle');
const denseModeToggleEl = document.getElementById('denseModeToggle');
const shareFilterBtnEl = document.getElementById('shareFilterBtn');
const hideVisitedToggleEl = document.getElementById('hideVisitedToggle');
const claimUnseenToggleEl = document.getElementById('claimUnseenToggle');
const clearVisitedBtnEl = document.getElementById('clearVisitedBtn');
const syncStateEl = document.getElementById('syncState');
let currentData = null;
let currentQuery = '';
let currentMediaFilter = 'all';
let strictTabScope = false;
let recentSortEnabled = false;
let focusModeEnabled = false;
let denseModeEnabled = false;
let hideVisitedEnabled = false;
let claimUnseenEnabled = false;
const STAR_KEY = 'suweb_starred_cards';
const VISITED_KEY = 'suweb_visited_cards';
const SANITIZE_CACHE_LIMIT = 120;
const sanitizeCache = new Map();
let refreshFailCount = 0;
const REFRESH_FAIL_CAP = 4;
let starSetCache = null;
let visitedSetCache = null;
function matchesQuery(card, query){
  if(!query) return true;
  const text = `${card?.title||''} ${card?.summary||''}`.toLowerCase();
  return text.includes(query);
}
function updateStarChipLabel(){
  const chip = document.getElementById('starredFilterChip');
  if (!chip) return;
  const count = getStarSet().size;
  chip.textContent = count > 0 ? `已收藏(${count})` : '已收藏';
}

function getStarSet(){
  if (starSetCache) return starSetCache;
  try {
    const raw = localStorage.getItem(STAR_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    starSetCache = new Set(Array.isArray(parsed) ? parsed.map(x => String(x || '')) : []);
    return starSetCache;
  } catch {
    starSetCache = new Set();
    return starSetCache;
  }
}

function saveStarSet(set){
  starSetCache = new Set(set);
  try { localStorage.setItem(STAR_KEY, JSON.stringify([...set])); } catch {}
  updateStarChipLabel();
}

function clearStarSet(){
  starSetCache = new Set();
  try { localStorage.removeItem(STAR_KEY); } catch {}
  updateStarChipLabel();
}

function isCardStarred(card){
  const id = String(card?.id || '').trim();
  if (!id) return false;
  return getStarSet().has(id);
}

function getVisitedSet(){
  if (visitedSetCache) return visitedSetCache;
  try {
    const raw = localStorage.getItem(VISITED_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    visitedSetCache = new Set(Array.isArray(parsed) ? parsed.map(x => String(x || '')) : []);
    return visitedSetCache;
  } catch {
    visitedSetCache = new Set();
    return visitedSetCache;
  }
}

function saveVisitedSet(set){
  visitedSetCache = new Set(set);
  try { localStorage.setItem(VISITED_KEY, JSON.stringify([...set])); } catch {}
}

function markCardVisited(cardId){
  const id = String(cardId || '').trim();
  if (!id) return;
  const set = getVisitedSet();
  if (set.has(id)) return;
  set.add(id);
  saveVisitedSet(set);
}

function clearVisitedSet(){
  visitedSetCache = new Set();
  try { localStorage.removeItem(VISITED_KEY); } catch {}
}

function isCardVisited(card){
  const id = String(card?.id || '').trim();
  if (!id) return false;
  return getVisitedSet().has(id);
}

function toggleCardStar(cardId){
  const id = String(cardId || '').trim();
  if (!id) return;
  const set = getStarSet();
  if (set.has(id)) set.delete(id);
  else set.add(id);
  saveStarSet(set);
  if (currentData) applyData(currentData);
  showToast(set.has(id) ? '已收藏' : '已取消收藏');
}

function isSameLocalDay(ts){
  if (!ts) return false;
  const d = new Date(ts);
  if (Number.isNaN(d.getTime())) return false;
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}

function hasClaimableLink(card){
  const link = String(card?.link||'').trim();
  return !!link && link !== '#';
}

function isRecentlyUpdated(card, days = 7){
  const ts = Date.parse(String(card?.updatedAt || card?.createdAt || ''));
  if (!Number.isFinite(ts)) return false;
  return (Date.now() - ts) <= days * 24 * 60 * 60 * 1000;
}

function matchesMediaFilter(card, mediaFilter){
  if(mediaFilter==='image') return !!String(card?.image||'').trim();
  if(mediaFilter==='video') return !!String(card?.video||'').trim();
  if(mediaFilter==='link') return hasClaimableLink(card);
  if(mediaFilter==='fresh-link') return hasClaimableLink(card) && isRecentlyUpdated(card, 7);
  if(mediaFilter==='fresh-14') return isRecentlyUpdated(card, 14);
  if(mediaFilter==='content') return !!String(card?.contentHtml||'').replace(/<[^>]+>/g,'').trim();
  if(mediaFilter==='today') return isSameLocalDay(card?.updatedAt || card?.createdAt);
  if(mediaFilter==='starred') return isCardStarred(card);
  if(mediaFilter==='unstarred') return !isCardStarred(card);
  if(mediaFilter==='star-link') return isCardStarred(card) && hasClaimableLink(card);
  return true;
}

function resetFilters(){
  currentQuery = '';
  currentMediaFilter = 'all';
  strictTabScope = false;
  recentSortEnabled = false;
  hideVisitedEnabled = false;
  claimUnseenEnabled = false;
  if (searchInputEl) searchInputEl.value = '';
  mediaFilterEls.forEach(btn => btn.classList.toggle('active', (btn.dataset.media||'all') === 'all'));
  tabScopeToggleEl?.classList.remove('active');
  tabScopeToggleEl?.setAttribute('aria-pressed','false');
  recentSortToggleEl?.classList.remove('active');
  recentSortToggleEl?.setAttribute('aria-pressed','false');
  hideVisitedToggleEl?.classList.remove('active');
  hideVisitedToggleEl?.setAttribute('aria-pressed','false');
  claimUnseenToggleEl?.classList.remove('active');
  claimUnseenToggleEl?.setAttribute('aria-pressed','false');
  if (starLinkFilterChipEl) starLinkFilterChipEl.classList.remove('active');
  if (currentData) applyData(currentData);
  showToast('已重置筛选');
}

function showToast(text){
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = text;
  el.style.display = 'block';
  clearTimeout(window.__suToastTimer);
  window.__suToastTimer = setTimeout(() => { el.style.display = 'none'; }, 1700);
}

function pickRandomVisibleCard(){
  const active = document.querySelector('.tabpage.active');
  if (!active) return;
  const cards = [...active.querySelectorAll('.item[data-card-id]')];
  if (!cards.length) {
    showToast('当前栏目暂无可随机内容');
    return;
  }
  const target = cards[Math.floor(Math.random() * cards.length)];
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.style.outline = '2px solid #5a85ff';
  target.style.outlineOffset = '2px';
  setTimeout(() => {
    target.style.outline = 'none';
    target.style.outlineOffset = '0';
  }, 1200);
  showToast(`随机定位：第 ${cards.indexOf(target) + 1} 条`);
}

async function copyActiveTabDigest(){
  const active = document.querySelector('.tabpage.active');
  if (!active) return;
  const cards = [...active.querySelectorAll('.item[data-card-id]')];
  if (!cards.length) return showToast('当前栏目暂无可复制内容');
  const title = active.id === 'page-help' ? (tabHelpEl?.textContent || '助力')
    : active.id === 'page-hang' ? (tabHangEl?.textContent || '代挂')
    : (tabBotsEl?.textContent || '机器人列表');
  const rows = cards.slice(0, 20).map((el, idx) => {
    const cardTitle = (el.querySelector('h3')?.textContent || '').trim();
    const summary = (el.querySelector('.sub')?.textContent || '').replace(/\s+/g, ' ').trim();
    return `${idx + 1}. ${cardTitle}${summary ? ` - ${summary}` : ''}`;
  });
  const digest = `【${title}】共 ${cards.length} 条\n${rows.join('\n')}`;
  await copyPlainText(digest, '本栏摘要已复制');
}

async function copyPlainText(text, okText='已复制'){
  const target = String(text || '').trim();
  if (!target) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(target);
      showToast(okText);
      return;
    }
  } catch {}
  try {
    const input = document.createElement('input');
    input.value = target;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
    showToast(okText);
  } catch {
    showToast('复制失败，请手动复制');
  }
}

async function copyCardLink(link){
  const target = String(link || '').trim();
  if (!target || target === '#') return;
  return copyPlainText(target, '链接已复制');
}

async function copyCardTitle(title){
  return copyPlainText(String(title || '').trim(), '标题已复制');
}

function updateNetworkUi(){

  if (!refreshBtnEl) return;
  const offline = typeof navigator !== 'undefined' && navigator.onLine === false;
  refreshBtnEl.classList.toggle('offline', offline);
  refreshBtnEl.title = offline ? '当前离线，点击可重试' : '刷新内容';
  const syncEl = document.getElementById('syncTime');
  if (syncEl && offline) syncEl.textContent = '当前离线';
}

function highlightText(raw, query){
  const text = String(raw || "");
  const q = String(query || "").trim();
  if (!q) return esc(text);
  const lower = text.toLowerCase();
  const qLower = q.toLowerCase();
  let i = 0;
  let out = "";
  while (i < text.length) {
    const hit = lower.indexOf(qLower, i);
    if (hit === -1) { out += esc(text.slice(i)); break; }
    out += esc(text.slice(i, hit));
    out += `<mark class="hl">${esc(text.slice(hit, hit + q.length))}</mark>`;
    i = hit + q.length;
  }
  return out;
}

function sanitizeHtml(html=''){
  const raw = String(html || '');
  const hit = sanitizeCache.get(raw);
  if (hit) return hit;
  let out=raw;
  out=out.replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi,'');
  out=out.replace(/<(iframe|object|embed|link|meta|base)[\s\S]*?>[\s\S]*?<\/\1>/gi,'');
  out=out.replace(/<(iframe|object|embed|link|meta|base)[^>]*\/?>/gi,'');
  out=out.replace(/\son\w+=("[^"]*"|'[^']*'|[^\s>]+)/gi,'');
  out=out.replace(/\s(srcdoc|formaction)=("[^"]*"|'[^']*'|[^\s>]+)/gi,'');
  out=out.replace(/(href|src)=("|')\s*(javascript:|data:text\/html)[\s\S]*?\2/gi,'$1="#"');
  out=out.replace(/\sstyle=("|')[\s\S]*?(expression|javascript:)[\s\S]*?\1/gi,'');
  sanitizeCache.set(raw, out);
  if (sanitizeCache.size > SANITIZE_CACHE_LIMIT) {
    const oldest = sanitizeCache.keys().next().value;
    if (oldest) sanitizeCache.delete(oldest);
  }
  return out;
}

function safeGetLocalStorage(key){
  try {
    return localStorage.getItem(key);
  } catch {
    return null;
  }
}

function safeSetLocalStorage(key, value){
  try {
    localStorage.setItem(key, value);
    return true;
  } catch {
    try {
      localStorage.removeItem('suweb_bootstrap_cache');
      localStorage.removeItem('suweb_bootstrap_etag');
      localStorage.setItem(key, value);
      return true;
    } catch {
      return false;
    }
  }
}

}


function getFetchTimeoutMs(force=false){
  if (typeof navigator === 'undefined') return force ? 5000 : 3000;
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const type = (conn && conn.effectiveType) ? String(conn.effectiveType) : '';
  if (/2g|slow-2g/i.test(type)) return force ? 9000 : 7000;
  if (/3g/i.test(type)) return force ? 7000 : 5000;
  return force ? 5000 : 3000;
}

async function fetchBootstrapWithRetry(force=false, signal){
  const attempts = 2;
  let lastError = null;
  const cachedEtag = safeGetLocalStorage('suweb_bootstrap_etag') || '';
  const hasCache = !!safeGetLocalStorage('suweb_bootstrap_cache');
  const offline = typeof navigator !== 'undefined' && navigator.onLine === false;
  if (offline && !force && hasCache) {
    const err = new Error('offline with cache');
    err.code = 'OFFLINE_CACHE';
    throw err;
  }
  for (let i = 0; i < attempts; i++) {
    let timer = null;
    let timeoutCtrl = null;
    let onAbort = null;
    try {
      const timeoutMs = getFetchTimeoutMs(force);
      timeoutCtrl = new AbortController();
      if (signal) {
        if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
        onAbort = () => timeoutCtrl.abort();
        signal.addEventListener('abort', onAbort, { once: true });
      }
      timer = setTimeout(() => timeoutCtrl.abort(), timeoutMs);
      const headers = cachedEtag && !force ? { 'If-None-Match': cachedEtag } : {};
      const resp = await fetch('/api/bootstrap', { signal: timeoutCtrl.signal, cache: force ? 'reload' : 'no-store', headers });
      if (resp.status === 304) return { notModified: true, etag: cachedEtag, data: null };
      if (!resp.ok) throw new Error('bootstrap failed');
      const etag = resp.headers.get('etag') || '';
      return { notModified: false, etag, data: await resp.json() };
    } catch (e) {
      lastError = e;
      if (signal?.aborted) throw e;
      if (i < attempts - 1) await new Promise(r => setTimeout(r, 300));
    } finally {
      if (timer) clearTimeout(timer);
      if (signal && onAbort) signal.removeEventListener('abort', onAbort);
    }
  }
  throw lastError || new Error('bootstrap failed');
}

async function init(force=false){
  if (bootstrapInFlight && !force) return bootstrapInFlight;

  if (force && bootstrapCtrl) {
    try { bootstrapCtrl.abort(); } catch {}
  }

  const reqSeq = ++bootstrapReqSeq;
  bootstrapCtrl = new AbortController();

  const btn = refreshBtnEl;
  const originalText = btn?.textContent;
  if (btn && force) {
    btn.disabled = true;
    btn.textContent = '刷新中...';
  }
  document.body.setAttribute('aria-busy', 'true');

  bootstrapInFlight = (async ()=>{
    let cacheShown = false;
    const cache = safeGetLocalStorage('suweb_bootstrap_cache');
    if (!force && cache) {
      try {
        const parsed = JSON.parse(cache);
        const isFreshCache = parsed?.ts && (Date.now() - parsed.ts) < CACHE_MAX_AGE_MS;
        if (parsed?.data && isFreshCache) {
          applyData(parsed.data);
          updateSyncTime(parsed.ts || Date.now());
          staleNoticeEl.style.display = 'none';
          cacheShown = true;
        }
      } catch {}
    }

    try{
      const result = await fetchBootstrapWithRetry(force, bootstrapCtrl.signal);
      if (reqSeq < bootstrapAppliedSeq) return;
      if (result.notModified && cache) {
        try {
          const parsed = JSON.parse(cache);
          if (!parsed?.data) throw new Error('invalid cache');
          staleNoticeEl.style.display='none';
          applyData(parsed.data);
          updateSyncTime(parsed.ts || Date.now());
          updateSyncState('内容已同步（命中缓存）');
          bootstrapAppliedSeq = reqSeq;
          return;
        } catch {
          safeRemoveLocalStorage('suweb_bootstrap_cache');
          safeRemoveLocalStorage('suweb_bootstrap_etag');
        }
      }
      const data = result.data;
      if (result.etag) safeSetLocalStorage('suweb_bootstrap_etag', result.etag);
      safeSetLocalStorage('suweb_bootstrap_cache', JSON.stringify({ts:Date.now(),data}));
      staleNoticeEl.style.display='none'; applyData(data);
      refreshFailCount = 0;
      updateSyncState('内容已同步');
      bootstrapAppliedSeq = reqSeq;
    }catch(e){
      if (e?.name === 'AbortError') return;
      if (cacheShown) {
        staleNoticeEl.style.display='block';
        updateSyncState('网络波动，当前展示离线缓存', true);
        return;
      }
      if(cache){ try{ const parsed=JSON.parse(cache); applyData(parsed.data); staleNoticeEl.style.display='block'; updateSyncState('网络波动，当前展示离线缓存', true); return; }catch{} }
      refreshFailCount = Math.min(REFRESH_FAIL_CAP, refreshFailCount + 1);
      const waitSec = Math.floor(getAutoRefreshIntervalMs() / 1000);
      updateSyncState(`拉取失败，约 ${waitSec}s 后自动重试`, true);
      pageHelpEl.innerHTML='<section class="card"><p class="empty">加载失败，请稍后重试。</p></section>';
    } finally {
      if (btn && force) {
        btn.disabled = false;
        btn.textContent = originalText || '刷新内容';
      }
      document.body.removeAttribute('aria-busy');
      if (bootstrapCtrl && bootstrapCtrl.signal.aborted) {
        // keep silent for superseded refreshes
      }
      bootstrapInFlight = null;
    }
  })();

  return bootstrapInFlight;
}

    claimUnseenToggleEl.setAttribute('aria-pressed', claimUnseenEnabled ? 'true' : 'false');
    if (currentData) applyData(currentData);
    showToast(claimUnseenEnabled ? '已筛选：可领且未浏览' : '已关闭：可领且未浏览');
  });
}
if (clearVisitedBtnEl) {
  clearVisitedBtnEl.addEventListener('click', () => {
    const size = getVisitedSet().size;
    if (!size) return showToast('暂无浏览记录');
    clearVisitedSet();
    if (currentData) applyData(currentData);
    showToast(`已清空 ${size} 条浏览记录`);
  });
}
window.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInputEl) {
    e.preventDefault();
    searchInputEl?.focus();
  }
  if (e.key === 'Escape' && document.activeElement === searchInputEl && searchInputEl?.value) {
    searchInputEl.value = '';
    currentQuery = '';
    if (currentData) applyData(currentData);
  }
  if (e.altKey && (e.key === 's' || e.key === 'S')) {
    e.preventDefault();
    currentMediaFilter = currentMediaFilter === 'starred' ? 'all' : 'starred';
    mediaFilterEls.forEach(btn => btn.classList.toggle('active', (btn.dataset.media||'all') === currentMediaFilter));
    if (currentData) applyData(currentData);
    showToast(currentMediaFilter === 'starred' ? '已切换到收藏筛选' : '已切换到全部内容');
    return;
  }
  if (e.altKey && (e.key === 'l' || e.key === 'L')) {
    e.preventDefault();
    currentMediaFilter = currentMediaFilter === 'link' ? 'all' : 'link';
    mediaFilterEls.forEach(btn => btn.classList.toggle('active', (btn.dataset.media||'all') === currentMediaFilter));
    if (currentData) applyData(currentData);
    showToast(currentMediaFilter === 'link' ? '已切换到可领取内容' : '已切换到全部内容');
    return;
  }
  if (e.altKey && (e.key === 'f' || e.key === 'F')) {
    e.preventDefault();
    currentMediaFilter = currentMediaFilter === 'fresh-14' ? 'all' : 'fresh-14';
    mediaFilterEls.forEach(btn => btn.classList.toggle('active', (btn.dataset.media||'all') === currentMediaFilter));
    if (currentData) applyData(currentData);
    showToast(currentMediaFilter === 'fresh-14' ? '已切换到14天更新内容' : '已切换到全部内容');
    return;
  }
  if (e.altKey && (e.key === 'n' || e.key === 'N')) {
    e.preventDefault();
    currentMediaFilter = currentMediaFilter === 'unstarred' ? 'all' : 'unstarred';
    mediaFilterEls.forEach(btn => btn.classList.toggle('active', (btn.dataset.media||'all') === currentMediaFilter));
    if (currentData) applyData(currentData);
    showToast(currentMediaFilter === 'unstarred' ? '已切换到未收藏内容' : '已切换到全部内容');
    return;
  }
  if (document.activeElement === searchInputEl) return;
  if (['1','2','3'].includes(e.key)) {
    const map = { '1': 'help', '2': 'hang', '3': 'bots' };
    const tab = map[e.key];
    const btn = [...document.querySelectorAll('.nav-btn')].find(x => (x.getAttribute('onclick')||'').includes(`'${tab}'`));
    if (btn) switchTab(tab, btn);
  }
  if (e.altKey && (e.key === 'r' || e.key === 'R')) {
    e.preventDefault();
    pickRandomVisibleCard();
    return;
  }
  if (e.altKey && (e.key === 'u' || e.key === 'U')) {
    e.preventDefault();
    claimUnseenEnabled = !claimUnseenEnabled;
    claimUnseenToggleEl?.classList.toggle('active', claimUnseenEnabled);
    claimUnseenToggleEl?.setAttribute('aria-pressed', claimUnseenEnabled ? 'true' : 'false');
    if (currentData) applyData(currentData);
    showToast(claimUnseenEnabled ? '已筛选：可领且未浏览' : '已关闭：可领且未浏览');
  }
});
if (mediaFilterEls.length) {
  mediaFilterEls.forEach(btn => {
    btn.addEventListener('click', () => {
      currentMediaFilter = btn.dataset.media || 'all';
      mediaFilterEls.forEach(x => x.classList.toggle('active', x === btn));
      if (starLinkFilterChipEl) starLinkFilterChipEl.classList.toggle('active', false);
      if (currentData) applyData(currentData);
    });
  });
}
if (tabScopeToggleEl) {
  tabScopeToggleEl.addEventListener('click', () => {
    strictTabScope = !strictTabScope;
    tabScopeToggleEl.classList.toggle('active', strictTabScope);
    tabScopeToggleEl.setAttribute('aria-pressed', strictTabScope ? 'true' : 'false');
    if (currentData) applyData(currentData);
  });
}
if (recentSortToggleEl) {
  recentSortToggleEl.addEventListener('click', () => {
    recentSortEnabled = !recentSortEnabled;
    recentSortToggleEl.classList.toggle('active', recentSortEnabled);
    recentSortToggleEl.setAttribute('aria-pressed', recentSortEnabled ? 'true' : 'false');
    if (currentData) applyData(currentData);
    showToast(recentSortEnabled ? '已切换：最近更新优先' : '已切换：默认排序');
  });
}
if (toTopBtnEl) {
  toTopBtnEl.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  window.addEventListener('scroll', () => {
    toTopBtnEl.classList.toggle('show', window.scrollY > 360);
  }, { passive: true });
}
restoreSearchState();
restoreActiveTab();
updateStarChipLabel();
updateNetworkUi();
init();

window.addEventListener('storage', (e) => {
  if (e.key === STAR_KEY) {
    starSetCache = null;
    updateStarChipLabel();
    if (currentData) applyData(currentData);
    return;
  }
  if (e.key === VISITED_KEY) {
    visitedSetCache = null;
    if (currentData) applyData(currentData);
  }
});

let lastAutoRefreshAt = Date.now();
let lastManualRefreshAt = 0;

function manualRefresh(){
  const now = Date.now();
  if (now - lastManualRefreshAt < 800) return;
  lastManualRefreshAt = now;
  init(true);
}

// 页面可见时每5分钟自动静默刷新一次，减少长时间挂页导致内容陈旧
setInterval(() => {
  if (document.visibilityState === 'visible') {
    if (shouldSkipAutoRefresh()) return;
    if (Date.now() - lastAutoRefreshAt < getAutoRefreshIntervalMs()) return;
    lastAutoRefreshAt = Date.now();
    init();
  }
}, 60 * 1000);

// 从后台切回前台时，如果超过60秒没刷新过则立即静默刷新一次
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - lastAutoRefreshAt < 60 * 1000) return;
  if (shouldSkipAutoRefresh()) return;
  lastAutoRefreshAt = Date.now();
  init();
});

// 网络恢复后自动静默刷新，减少离线后回网仍停留旧内容的时间
window.addEventListener('online', () => {
  updateNetworkUi();
  updateSyncState('网络已恢复，正在刷新内容');
  lastAutoRefreshAt = Date.now();
  init();
});

window.addEventListener('offline', () => {
  updateNetworkUi();
  staleNoticeEl.style.display = 'block';
  updateSyncState('当前离线，展示缓存内容', true);
});

function shouldSkipAutoRefresh(){
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return true;
  if (document.activeElement === searchInputEl) return true;
  if (bootstrapInFlight) return true;
  return false;
}
</script>
</body></html>
